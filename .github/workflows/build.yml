name: Build Moviesx (Mobile & Desktop)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - android
      android_variant:
        description: 'Android APK build variant'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.label }})
    if: ${{ inputs.target == 'all' || inputs.target == 'desktop' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'Windows'
            platform: 'windows-latest'
            rust_target: ''
            tauri_args: ''
            artifact_name: 'moviesx-windows'
          - label: 'macOS Apple Silicon'
            platform: 'macos-latest'
            rust_target: 'aarch64-apple-darwin'
            tauri_args: '--target aarch64-apple-darwin'
            artifact_name: 'moviesx-macos-arm64'
          - label: 'macOS Intel'
            platform: 'macos-latest'
            rust_target: 'x86_64-apple-darwin'
            tauri_args: '--target x86_64-apple-darwin'
            artifact_name: 'moviesx-macos-x64'
          - label: 'Linux'
            platform: 'ubuntu-22.04'
            rust_target: ''
            tauri_args: ''
            artifact_name: 'moviesx-linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKit dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Moviesx desktop bundle
        run: npx tauri build ${{ matrix.tauri_args }}

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  build-android:
    name: Build Android APK (${{ inputs.android_variant }})
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms and NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Initialize Tauri Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Build Android Debug APK
        if: ${{ inputs.android_variant == 'debug' }}
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: npx tauri android build --debug --apk --ci

      - name: Build Android Release APK
        if: ${{ inputs.android_variant == 'release' }}
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: npx tauri android build --apk --ci

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moviesx-android-${{ inputs.android_variant }}-apk
          if-no-files-found: error
          retention-days: 14
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
