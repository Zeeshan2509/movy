    <title>Moviesx — Watch Free Movies, TV Shows &amp; Anime</title>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (regs && regs.length) {
            Promise.all(
              regs.map(function (r) {
                return r.unregister();
              }),
            ).then(function () {
              if (window.caches) {
                caches.keys().then(function (keys) {
                  Promise.all(
                    keys.map(function (k) {
                      return caches.delete(k);
                    }),
                  ).then(function () {
                    window.location.reload();
                  });
                });
              } else {
                window.location.reload();
              }
            });
          }
        });
      }
    </script>
    <meta
      name="description"
      content="Watch free movies, TV shows, and anime online in HD on Moviesx. Ad-free streaming with no signup required."
    />
