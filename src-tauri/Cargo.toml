[package]
name = "moviesx"
version = "0.2.1"
description = "Moviesx - Ad-free streaming app for movies, TV shows, and anime"
authors = ["Moviesx"]
edition = "2021"

[lib]
name = "moviesx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
