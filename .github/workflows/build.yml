name: Build Moviesx (Mobile & Desktop)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - windows
          - linux
          - macos
          - macos-arm64
          - macos-x64
          - android
      android_variant:
        description: 'Android APK build variant'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-windows:
    name: Build Desktop (Windows)
    if: ${{ inputs.target == 'all' || inputs.target == 'desktop' || inputs.target == 'windows' }}
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Cargo.lock exists for caching
        shell: bash
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build Moviesx Windows bundle
        run: npx tauri build --ci

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: moviesx-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi

  build-linux:
    name: Build Desktop (Linux)
    if: ${{ inputs.target == 'all' || inputs.target == 'desktop' || inputs.target == 'linux' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Cargo.lock exists for caching
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKit & AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build Moviesx Linux bundle
        env:
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build --ci

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: moviesx-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  build-macos-arm64:
    name: Build Desktop (macOS Apple Silicon)
    if: ${{ inputs.target == 'all' || inputs.target == 'desktop' || inputs.target == 'macos' || inputs.target == 'macos-arm64' }}
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Ensure Cargo.lock exists for caching
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build Moviesx macOS Apple Silicon bundle
        run: npx tauri build --ci --target aarch64-apple-darwin

      - name: Upload macOS Apple Silicon installer
        uses: actions/upload-artifact@v4
        with:
          name: moviesx-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg

  build-macos-x64:
    name: Build Desktop (macOS Intel)
    if: ${{ inputs.target == 'all' || inputs.target == 'desktop' || inputs.target == 'macos' || inputs.target == 'macos-x64' }}
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Ensure Cargo.lock exists for caching
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build Moviesx macOS Intel bundle
        run: npx tauri build --ci --target x86_64-apple-darwin

      - name: Upload macOS Intel installer
        uses: actions/upload-artifact@v4
        with:
          name: moviesx-macos-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg

  build-android:
    name: Build Android APK (${{ inputs.android_variant }})
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-${{ steps.setup-android.outputs.android-home }}}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "platforms;android-34" "ndk;27.0.12077973"
          sdkmanager "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;35.0.1"
          yes | sdkmanager --licenses >/dev/null || true
          echo "NDK_HOME=${SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Ensure Cargo.lock exists for caching
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize Tauri Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci --skip-targets-install
          fi

      - name: Build Android Debug APK
        if: ${{ inputs.android_variant == 'debug' }}
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: npx tauri android build --debug --apk --ci

      - name: Build Android Release APK
        if: ${{ inputs.android_variant == 'release' }}
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: npx tauri android build --apk --ci

      - name: Sign unsigned release APK for direct installation
        if: ${{ inputs.android_variant == 'release' }}
        run: |
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            KEYSTORE="${HOME}/.android/debug.keystore"
            if [ ! -f "$KEYSTORE" ]; then
              mkdir -p "${HOME}/.android"
              keytool -genkey -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | while read -r apk; do
              signed="${apk%-unsigned.apk}-signed.apk"
              "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --out "$signed" "$apk"
              rm -f "$apk"
            done
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moviesx-android-${{ inputs.android_variant }}-apk
          if-no-files-found: error
          retention-days: 14
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
